<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PDSL-201 · paynani profile</title>
<!--
  Mockup PDSL-201: Profile de paynani, sobre la composición de NDSL-201.
  Marca según brand/README.md de iaaorgmx/paynani: sobre el menú oscuro va
  paynani-horizontal-claro.svg (se cambia de archivo, no de opacidad); el único
  acento es la grana #8f2d2b; tipografía del sistema. Los íconos son trazos
  propios en línea, sin fuentes de íconos remotas.
-->
<style>
  :root {
    --grana: #8f2d2b; --tinta: #1c1c1a; --papel: #f7f7f5; --gris: #66655f; --linea: #dedcd6;
    --menu: #262b36; --menu-borde: #343a47; --menu-texto: #d5d7dc; --menu-tenue: #8b909b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 953px; overflow: hidden; }
  body {
    background: #efeeea; color: var(--tinta); position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* Menú lateral */
  aside { position: absolute; left: 0; top: 0; bottom: 0; width: 245px; background: var(--menu); color: var(--menu-texto); }
  .marca { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 10px; border-bottom: 1px solid var(--menu-borde); background: #20242e; }
  .marca img { height: 40px; display: block; }
  .marca svg.i { color: var(--menu-tenue); width: 22px; height: 22px; }
  .usuario { height: 82px; padding: 14px 12px 0 12px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--menu-borde); }
  .usuario b { display: block; font-size: 20px; font-weight: 600; color: #fff; }
  .usuario small { display: block; margin-top: 3px; font-size: 15px; color: var(--menu-texto); }
  .usuario svg.i { width: 22px; height: 22px; color: #fff; margin-top: 2px; }
  .buscar { margin: 16px 7px 10px; height: 38px; border: 1px solid #5b6170; border-radius: 3px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 15px; color: var(--menu-texto); }
  .grupo { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 10px 16px; font-size: 14px; color: var(--menu-tenue); }
  .grupo svg.i { width: 15px; height: 15px; }
  nav a { display: flex; align-items: center; gap: 10px; height: 41.5px; padding: 0 16px 0 18px; font-size: 13.5px; color: var(--menu-texto); }
  nav a svg.i { width: 16px; height: 16px; color: var(--menu-tenue); }
  nav a .flecha { margin-left: auto; width: 14px; height: 14px; }
  nav a.sub { height: 38px; padding-left: 44px; font-size: 13px; color: var(--menu-tenue); }
  nav a.sub.activo { color: #fff; background: #20242e; box-shadow: inset 3px 0 0 #d8887f; }
  nav a.abierto { color: #fff; }
  .separa { border-top: 1px solid var(--menu-borde); margin-top: 6px; padding-top: 6px; }

  /* Barra superior */
  .barra { position: absolute; left: 245px; right: 0; top: 0; height: 64px; background: #fff; display: flex; justify-content: flex-end; }
  .barra div { width: 62px; border-left: 1px solid #ecebe7; display: flex; align-items: center; justify-content: center; color: #3c3b37; }
  .barra svg.i { width: 22px; height: 22px; }

  /* Encabezado */
  .encabezado { position: absolute; left: 245px; right: 0; top: 64px; height: 81px; background: var(--grana); color: #fff; display: flex; align-items: center; padding: 0 22px 0 24px; }
  .encabezado h1 { font-size: 32px; font-weight: 600; margin-left: 18px; }
  .encabezado svg.i { width: 30px; height: 30px; stroke-width: 2; }
  .encabezado .atras { margin-left: auto; }

  /* Contenido */
  .panel { position: absolute; left: 245px; top: 145px; bottom: 0; width: 815px; background: #fff; }
  .perfil { text-align: center; padding-top: 31px; }
  .avatar { width: 113px; height: 113px; border-radius: 50%; margin: 0 auto; background: #efe3e1; color: var(--grana);
            display: flex; align-items: center; justify-content: center; font-size: 42px; font-weight: 600; letter-spacing: 1px; }
  .perfil h2 { margin-top: 12px; font-size: 23px; font-weight: 600; line-height: 1.12; }
  .perfil h3 { font-size: 23px; font-weight: 600; line-height: 1.12; }
  .perfil p { margin-top: 2px; font-size: 15.5px; color: #3c3b37; }
  ul { list-style: none; margin: 37px 17px 0 30px; border-top: 1px solid var(--linea); }
  li { height: 67px; border-bottom: 1px solid var(--linea); display: flex; align-items: center; gap: 18px; padding: 0 12px 0 2px; font-size: 16.5px; color: #2a2a27; }
  li svg.i { width: 24px; height: 24px; color: var(--tinta); }
  li .flecha { margin-left: auto; width: 20px; height: 20px; }

  /* Botón de chat: su propio ícono, nunca la voluta en un contenedor */
  .chat { position: absolute; right: 26px; bottom: 16px; width: 72px; height: 72px; border-radius: 50%; background: var(--grana);
          display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 6px 18px rgba(28,28,26,.22); }
  .chat svg.i { width: 34px; height: 34px; stroke-width: 1.7; }
</style>
</head>
<body>
  <aside>
